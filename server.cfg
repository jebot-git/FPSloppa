// Entryway dedicated server. Restart to apply changes.
sets sv_hostname "Entryway Arena"
set net_ip "*"          // Bind all interfaces, or specify a local address.
set net_port "7777"     // UDP; allow/forward this port for Internet hosting.
set sv_maxclients "8"   // 1–16 players (default 8); the dedicated server takes no slot.
set fraglimit "20"
set timelimit "10"      // Minutes; advance rotation after intermission.
set sv_voice "1"        // 0 disables voice relay for this server.
map "lqdm1"             // lqdm1–lqdm8 or cached custom ID.

// Optional ordered rotation. Empty/omitted repeats the single map above.
// set sv_maplist "lqdm1 lqdm2 lqdm4 lqdm7 lqdm8"

// Modes are dedicated-server options. In-game hosts always use DM.
set sv_gametype "dm"       // dm, tdm, ctf or koth.
set sv_gametypes ""        // Optional allowlist, e.g. "dm tdm ctf koth"; includes initial mode.
set capturelimit "5"      // CTF captures, 1–100.
set hilllimit "120"       // KOTH points (one per uncontested second), 1–3600.
set sv_friendlyfire "0"   // Team damage; teamkills subtract a frag when enabled.
set sv_votes "1"          // Majority votes for maps, team balance and allowed game types.

// Optional external Mumble service. The game advertises a client handoff;
// it does not contain a Mumble network client or run a Mumble server.
set sv_voice_backend "builtin" // builtin or mumble. sv_voice 0 disables either.
set sv_mumble_url ""            // e.g. "mumble://voice.example.org:64738/Entryway"

// Dedicated diagnostics: off, normal (lifecycle/events), or verbose.
set sv_log_level "normal"
set sv_log_file ""         // Empty: console only. Example: "user://logs/server.jsonl"
set sv_log_max_mb "8"      // Rotating file size, 1–512 MiB.
set sv_log_backups "3"     // Retain 1–9 older files (.1 is newest).
