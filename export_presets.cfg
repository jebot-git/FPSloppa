[preset.3]
name="Quest (experimental)"
platform="Android"
runnable=false
advanced_options=true
dedicated_server=false
custom_features="standalone_xr,quest_xr"
export_filter="all_resources"
include_filter="*.vrm,*.bsp,*.json,*.lit,*.cfg,*.txt,*.md"
exclude_filter="Builds/*,maps/*,vrm/*,optional-map-pack/*,optional-threewave-tools/*,deathmatch/tests/*,test-results/*,tools/*,docs/*,deathmatch/audio/music/samples/*"
export_path="../Builds/Android/Entryway-Quest.apk"
script_export_mode=0

[preset.3.options]
xr_features/enable_meta_plugin=true
meta_xr_features/body_tracking=1
meta_xr_features/hand_tracking=1
meta_xr_features/eye_tracking=1
meta_xr_features/face_tracking=1


gradle_build/use_gradle_build=true
gradle_build/min_sdk="29"
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="org.entryway.arena.quest"
package/name="Entryway Arena"
package/signed=true
version/code=8
version/name="0.4v"
xr_features/xr_mode=1
permissions/internet=true
permissions/record_audio=true
screen/immersive_mode=true
screen/support_small=false
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
textures/vram_compression/import_etc2_astc=true

