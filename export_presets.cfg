[preset.0]
name="Linux PC"
platform="Linux"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.vrm,*.bsp,*.json,*.lit,*.cfg,*.txt,*.md"
exclude_filter="Builds/*,maps/*,vrm/*,optional-map-pack/*,optional-threewave-tools/*,deathmatch/tests/*,test-results/*,tools/*,docs/*,deathmatch/audio/music/samples/*"
export_path="../Builds/Linux/Entryway.x86_64"
script_export_mode=0

[preset.0.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

