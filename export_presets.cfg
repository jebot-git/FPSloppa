[preset.0]
name="Linux PC"
platform="Linux"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="deathmatch/audio/experimental/*.wav,*.vrm,*.bsp,*.lmp,*.wad,*.json,*.lit,*.cfg,*.txt,*.md"
exclude_filter="export_presets.cfg,client.example.cfg,NETWORK_TESTING.md,LIVE_VR_TEST.md,SESSION_FEATURES.md,ICON.md,release-assets/*,.agents/*,.codex/*,*.log,dist/*,external-tools/*,materials/*,textures/*,Builds/*,maps/*,vrm/*,optional-map-pack/*,optional-threewave-tools/*,optional-ad-tools/*,optional-tf-tools/*,optional-tf-map-pack/*,optional-arena-pack/*,deathmatch/tests/*,test-results/*,tools/*,docs/*,deathmatch/audio/music/samples/*"
export_path="../Builds/Linux/FPSloppa.x86_64"
script_export_mode=0

[preset.0.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

[preset.1]
name="Windows PC"
platform="Windows Desktop"
runnable=false
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="deathmatch/audio/experimental/*.wav,*.vrm,*.bsp,*.lmp,*.wad,*.json,*.lit,*.cfg,*.txt,*.md"
exclude_filter="export_presets.cfg,client.example.cfg,NETWORK_TESTING.md,LIVE_VR_TEST.md,SESSION_FEATURES.md,ICON.md,release-assets/*,.agents/*,.codex/*,*.log,dist/*,external-tools/*,materials/*,textures/*,Builds/*,maps/*,vrm/*,optional-map-pack/*,optional-threewave-tools/*,optional-ad-tools/*,optional-tf-tools/*,optional-tf-map-pack/*,optional-arena-pack/*,deathmatch/tests/*,test-results/*,tools/*,docs/*,deathmatch/audio/music/samples/*"
export_path="../Builds/Windows/FPSloppa.exe"
script_export_mode=0

[preset.1.options]
application/file_version="0.15.0.0"
application/product_version="0.15.0.0"

application/icon="res://deathmatch/icon-final.png"

binary_format/architecture="x86_64"
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

; Dedicated server is built only by tools/build_console_server.py.
; A generic export template can include window/audio drivers and client plugins.

[preset.2]
name="Quest (experimental)"
platform="Android"
runnable=false
advanced_options=true
dedicated_server=false
custom_features="standalone_xr,quest_xr"
export_filter="all_resources"
include_filter="deathmatch/audio/experimental/*.wav,*.vrm,*.bsp,*.lmp,*.wad,*.json,*.lit,*.cfg,*.txt,*.md,deathmatch/assets/offline-base.zip"
exclude_filter="export_presets.cfg,client.example.cfg,NETWORK_TESTING.md,LIVE_VR_TEST.md,SESSION_FEATURES.md,ICON.md,release-assets/*,.agents/*,.codex/*,*.log,dist/*,external-tools/*,materials/*,textures/*,Builds/*,maps/*,vrm/*,optional-map-pack/*,optional-threewave-tools/*,optional-ad-tools/*,optional-tf-tools/*,optional-tf-map-pack/*,optional-arena-pack/*,deathmatch/tests/*,test-results/*,tools/*,docs/*,deathmatch/audio/music/samples/*"
export_path="../Builds/Android/FPSloppa-Quest.apk"
script_export_mode=0

[preset.2.options]
xr_features/enable_meta_plugin=true
meta_xr_features/body_tracking=1
meta_xr_features/hand_tracking=1
meta_xr_features/eye_tracking=1
meta_xr_features/face_tracking=1


gradle_build/use_gradle_build=true
gradle_build/min_sdk="29"
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="org.entryway.arena.quest"
package/name="FPSloppa"
package/signed=true
version/code=20
version/name="0.15v"
xr_features/xr_mode=1
permissions/internet=true
permissions/record_audio=true
screen/immersive_mode=true
screen/support_small=false
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
textures/vram_compression/import_etc2_astc=true
