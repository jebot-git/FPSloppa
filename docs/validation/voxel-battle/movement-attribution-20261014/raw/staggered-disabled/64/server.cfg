sets sv_hostname "CQ Frontier · Classes Prototype"
set net_ip "*"
set net_port "7777"
set sv_maxclients "32"
set sv_gametype "cq"
set sv_gametypes "cq"
set sv_maplist "voxel_jungle"
map "voxel_jungle"
set sv_weapon_rules "ut99"
set sv_bot_fill "0"
set sv_votes "0"
set sv_announcer "0"
set fraglimit "100" # CQ points use a fixed 200-point target
set sv_cq_quake_movement "0"
set sv_cq_tick_rate "30"
set sv_cq_backend "monolithic"
set timelimit "15"

# 32 slots is the supported ceiling. Set sv_cq_maxclients to 64 ONLY for unsupported experiments.
# sv_maxclients is not the capacity setting for this CQ arena.
set sv_cq_maxclients "32"

set sv_cq_maxclients "64"
set net_ip "127.0.0.1"
set net_port "7779"
