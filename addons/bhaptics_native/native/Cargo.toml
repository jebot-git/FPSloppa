[package]
name = "fpsloppa-bhaptics-native"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
godot = { version = "=0.5.5", features = ["api-4-5"] }
freehaptics = "=0.3.1"
btleplug = "=0.11.8"
tokio = { version = "1", features = ["rt", "time", "sync"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.19.0"
jni-utils = "=0.1.1"

[profile.release]
strip = "debuginfo"
