# Copy to server.cfg, generate a private key file, then enable the worker port.
set sv_hostname "FPSloppa bot service"
set net_ip "127.0.0.1"
set net_port "7777"
set sv_maxclients "16"
set sv_bot_fill "0"
set sv_gametype "st"
set sv_gametypes "st"
set st_maplist "ctf_katabatic"
set sv_weapon_rules "quake"
set sv_lobby "0"
set sv_public "0"
set sv_query_port "0"
set sv_voice "0"
set sv_log_level "normal"
set sv_log_file ""
set rcon_password ""
set sv_bot_worker_port "0"
set sv_bot_worker_bind "127.0.0.1"
set sv_bot_worker_key_file "/srv/fpsloppa/bot-worker.key"
set sv_bot_worker_limit "16"
map "ctf_katabatic"
