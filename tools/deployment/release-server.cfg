// Public release server at 45.147.228.101. No credentials belong in this file.
sets sv_hostname "FPSloppa | All Modes | No Bots"
set net_ip "*"
set net_port "7777"
set sv_query_port "7779"
set sv_public "0"
set sv_maxclients "16"
set sv_gametype "dm"
set sv_gametypes "dm tdm ctf koth ig if ft cc tf tb as de st"
set sv_ballot_exclude_modes "tb tf cc"
map "qsrc_dm1"
set fraglimit "20"
set timelimit "10"
set capturelimit "5"
set hilllimit "120"
set sv_votes "1"
set sv_lobby "1"
set sv_lobby_seconds "45"
set sv_de_prepare "20"
// First to four wins; halftime after three, absolute maximum six rounds.
set sv_de_winlimit "4"
set sv_de_roundtime "120"
set sv_de_bombtime "45"
set sv_bot_fill "0"
set sv_bot_worker_port "0"
set sv_bot_worker_limit "0"
set sv_bot_worker_key_file ""
set sv_voice "1"
set sv_log_level "normal"
set sv_log_file "user://logs/release-server.jsonl"
set sv_log_max_mb "8"
set sv_log_backups "3"
set rcon_password ""
set rcon_bind "127.0.0.1"
