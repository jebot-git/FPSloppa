; Copy this file and pass its absolute path after -- --client-config.
; Example: ./run-vr.sh -- --client-config /absolute/path/client.cfg
; Menu edits save to the selected file. Names apply on the next join.
[player]
name="YourCallsign"

[network]
address="127.0.0.1"

; Saved by TURN SETTINGS in the VR menu. Units are degrees/second and degrees.
[vr]
smooth_turn=true
turn_speed=120.0
snap_angle=30.0

; Settings → Graphics: head-relative VR HUD, height in metres.
[presentation]
; Local announcer volume, 0 disables playback. Server must enable sv_announcer.
announcer=0.8
; 0=pixelated with mipmaps, 1=trilinear, 2=anisotropic (default).
texture_filter=2
; valid range 0.7–1.4
hud_scale=1.0
; valid range -0.65–0.55
hud_y=-0.46

; Voice preferences survive reconnects and restarts. 0=listen, 1=PTT, 2=VOX.
[voice]
mode=1
mute_all=false
input_device="Default"
threshold=0.018
