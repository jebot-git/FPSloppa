; Copy this file and pass its absolute path after -- --client-config.
; Example: ./run-vr.sh -- --client-config /absolute/path/client.cfg
; Menu edits save to the selected file. Names apply on the next join.
[player]
name="YourCallsign"

[network]
address="127.0.0.1"

; Saved by TURN SETTINGS in the VR menu. Units are degrees/second and degrees.
[vr]
smooth_turn=true
turn_speed=120.0
snap_angle=30.0
